# Banco H2 local (arquivo)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/agenda-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.br.com.levima.agenda=DEBUG

# Admin local (altere em producao via ADMIN_PASSWORD)
app.admin.password=${ADMIN_PASSWORD:admin123}
