<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Contatos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="container container-wide">
        <div class="header header-admin">
            <div><h1>Contatos Cadastrados</h1></div>
            <div class="toolbar">
                <a th:href="@{/admin}" class="btn btn-secondary">Voltar ao Painel</a>
                <a th:href="@{/admin/export/contatos.xlsx}" class="btn btn-primary">Exportar Excel</a>
            </div>
        </div>
        <div class="content">
            <div th:if="${contatos.isEmpty()}" style="text-align:center;padding:40px;color:#999;">
                Nenhum contato cadastrado.
            </div>

            <table th:if="${!contatos.isEmpty()}" style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:#667eea;color:white;">
                        <th style="padding:12px;text-align:left;">Nome</th>
                        <th style="padding:12px;text-align:left;">Email</th>
                        <th style="padding:12px;text-align:left;">Celular</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="contato : ${contatos}" style="border-bottom:1px solid #eee;">
                        <td style="padding:12px;" th:text="${contato.nome}"></td>
                        <td style="padding:12px;" th:text="${contato.email}"></td>
                        <td style="padding:12px;" th:text="${contato.celular}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination" th:if="${totalPaginas > 1}">
                <a th:if="${paginaAtual > 0}" th:href="@{/admin/contatos(page=${paginaAtual - 1})}">Anterior</a>
                <span th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}">
                    <a th:href="@{/admin/contatos(page=${i})}" th:text="${i + 1}"
                       th:classappend="${i == paginaAtual} ? 'active' : ''"></a>
                </span>
                <a th:if="${paginaAtual < totalPaginas - 1}" th:href="@{/admin/contatos(page=${paginaAtual + 1})}">Proxima</a>
            </div>
        </div>
    </div>
</body>
</html>
