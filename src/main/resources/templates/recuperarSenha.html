<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - MeAgendaAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2 style="text-align:center;margin-bottom:20px;">Recuperar Senha</h2>

        <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

        <form th:action="@{/recuperar-senha}" th:object="${recuperarForm}" method="post">
            <div class="form-group">
                <label for="email">Email cadastrado</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" th:field="*{novaSenha}" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="confirmaSenha">Confirmar nova senha</label>
                <input type="password" id="confirmaSenha" th:field="*{confirmaSenha}" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar codigo de verificacao</button>
        </form>

        <div class="auth-links">
            <p><a th:href="@{/login}">Voltar ao login</a></p>
        </div>
    </div>
</body>
</html>
