<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - MeAgendaAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Meu Perfil</h1>
            <p>Atualize seus dados e senha</p>
        </div>
        <div class="content">
            <div th:if="${sucesso}" class="alert alert-success" th:text="${mensagem}"></div>
            <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

            <form th:action="@{/perfil}" th:object="${perfilForm}" method="post">
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" th:value="${email}" disabled>
                </div>
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" required>
                </div>
                <div class="form-group">
                    <label for="celular">Celular</label>
                    <input type="text" id="celular" th:field="*{celular}" required>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Perfil</button>
            </form>

            <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">

            <h3 style="margin-bottom:16px;">Alterar Senha</h3>
            <form th:action="@{/perfil/alterar-senha}" method="post">
                <div class="form-group">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" name="senhaAtual" required>
                </div>
                <div class="form-group">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmaSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmaSenha" name="confirmaSenha" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-secondary">Alterar Senha</button>
            </form>

            <div class="toolbar" style="margin-top:24px;">
                <a th:href="@{/agenda}" class="btn btn-secondary">Voltar a Agenda</a>
            </div>
        </div>
    </div>
</body>
</html>
