<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Agendamentos - MeAgendaAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Meus Agendamentos</h1>
            <p>Gerencie seus agendamentos de atendimento</p>
        </div>
        <div class="content">
            <div th:if="${sucesso}" class="alert alert-success">
                <span th:text="${mensagem}">Operacao realizada com sucesso!</span>
            </div>
            <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

            <p>Olá, <strong th:text="${nomeUsuario}"></strong>!</p>

            <div class="toolbar">
                <a th:href="@{/agendar}" class="btn btn-primary">+ Novo Agendamento</a>
                <a th:href="@{/catalogo}" class="btn btn-secondary">Catalogo de Servicos</a>
                <a th:href="@{/perfil}" class="btn btn-secondary">Meu Perfil</a>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">Sair</button>
                </form>
            </div>

            <h3 style="margin: 20px 0 16px;">Meus Agendamentos</h3>

            <div th:if="${agendamentos.isEmpty()}" style="text-align:center;padding:40px;color:#999;">
                <p>Voce ainda nao tem agendamentos.</p>
                <a th:href="@{/agendar}" class="btn btn-primary">Fazer um Agendamento</a>
            </div>

            <div th:each="agendamento : ${agendamentos}" class="card">
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                    <strong>
                        <span th:text="${#temporals.format(agendamento.data, 'dd/MM/yyyy')}"></span>
                        as <span th:text="${agendamento.horario}"></span>
                    </strong>
                    <span class="status" th:classappend="${'status-' + agendamento.status.valor}"
                          th:text="${agendamento.status.valor}"></span>
                </div>
                <p th:if="${agendamento.servicoNome != null}">
                    <strong>Servico:</strong> <span th:text="${agendamento.servicoNome}"></span>
                </p>
                <p th:if="${agendamento.descricao != null and agendamento.descricao != ''}">
                    <strong>Descricao:</strong> <span th:text="${agendamento.descricao}"></span>
                </p>
                <div class="toolbar" th:if="${agendamento.status.valor != 'cancelado'}">
                    <a th:href="@{/agendar/editar(id=${agendamento.id})}" class="btn btn-secondary">Editar</a>
                    <form th:action="@{/cancelar-agendamento}" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${agendamento.id}">
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Cancelar este agendamento?')">Cancelar</button>
                    </form>
                </div>
            </div>

            <div class="pagination" th:if="${totalPaginas > 1}">
                <a th:if="${paginaAtual > 0}" th:href="@{/agenda(page=${paginaAtual - 1})}">Anterior</a>
                <span th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}">
                    <a th:href="@{/agenda(page=${i})}" th:text="${i + 1}"
                       th:classappend="${i == paginaAtual} ? 'active' : ''"></a>
                </span>
                <a th:if="${paginaAtual < totalPaginas - 1}" th:href="@{/agenda(page=${paginaAtual + 1})}">Proxima</a>
            </div>
        </div>
    </div>
</body>
</html>
