<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MeAgendaAI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo">
            <img th:src="@{/MeAgendaAI_without_bg.png}" alt="MeAgendaAI Logo" class="logo-img">
        </div>

        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-error">
            <strong>Erro:</strong> <span th:text="${erro}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email / Usuario</label>
                <input type="text" id="email" name="email" placeholder="seu.email@exemplo.com ou admin" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <div class="auth-links">
            <p><a th:href="@{/recuperar-senha}">Esqueci minha senha</a></p>
            <p>Ainda nao tem cadastro? <a th:href="@{/cadastro}">Cadastre-se aqui</a></p>
        </div>
    </div>
</body>
</html>
