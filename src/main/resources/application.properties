spring.application.name=agenda
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Admin (defina ADMIN_PASSWORD em producao)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# OTP
app.otp.max-tentativas=5
app.otp.validade-minutos=10
app.otp.max-envios-por-hora=3

# Agendamento
app.agendamento.max-por-semana=3
app.agendamento.antecedencia-dias=1

# Vonage SMS (opcional)
vonage.api-key=${VONAGE_API_KEY:}
vonage.api-secret=${VONAGE_API_SECRET:}
vonage.from-number=${VONAGE_FROM_NUMBER:MeAgenda}

# CallMeBot WhatsApp (opcional)
callmebot.enabled=${CALLMEBOT_ENABLED:false}
callmebot.apikey=${CALLMEBOT_APIKEY:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
